name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DALAMUD_HOME: /tmp/dalamud

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Download Dalamud
      run: |
        wget https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -O ${{ env.DALAMUD_HOME }}.zip
        unzip ${{ env.DALAMUD_HOME }}.zip -d ${{ env.DALAMUD_HOME }}

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    # 关键修复步骤
    - name: Pack Plugin
      run: |
        # 1. 先进入 Release 父目录
        cd vnavmesh/bin/Release/

        # 2. 尝试进入以 net 开头的子目录 (兼容 net10.0, net10.0-windows 等)
        # 如果没有子目录，这行报错会被忽略，直接在当前目录打包
        cd net* || true

        # 3. 打印当前路径确认为准
        echo "Packing files from: $(pwd)"
        ls -la # 列出文件供检查

        # 4. 打包所有文件 (*) 到项目根目录的 vnavmesh.zip
        zip -r ../../../../vnavmesh.zip *

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: vnavmesh.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate repo.json
      run: |
        import json
        import os
        import glob

        # 同样使用通配符查找 json，确保万无一失
        # 优先查找深层目录
        json_files = glob.glob('vnavmesh/bin/Release/net*/vnavmesh.json')
        # 如果找不到，再试着找浅层目录
        if not json_files:
            json_files = glob.glob('vnavmesh/bin/Release/vnavmesh.json')

        if not json_files:
            print("Error: vnavmesh.json not found!")
            exit(1)

        json_path = json_files[0]
        print(f"Found json at: {json_path}")

        with open(json_path, 'r') as f:
            plugin_info = json.load(f)

        tag = os.environ['GITHUB_REF_NAME']
        repo = os.environ['GITHUB_REPOSITORY']
        download_url = f"https://github.com/{repo}/releases/download/{tag}/vnavmesh.zip"

        plugin_info['DownloadLinkInstall'] = download_url
        plugin_info['DownloadLinkUpdate'] = download_url
        plugin_info['DownloadLinkTesting'] = download_url

        repo_json = [plugin_info]

        with open('repo.json', 'w') as f:
            json.dump(repo_json, f, indent=4)
      shell: python

    - name: Deploy to gh-pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: .
        publish_branch: gh-pages
        keep_files: true
        include_files: repo.json
